<a class="skip-link" href="#main" (click)="$event.preventDefault(); main.focus()">Saltar al contenido</a>
<header class="app-header">
  <h1 class="app-title">Álbum</h1>
  @if (session.isAuthenticated()) {
    <button type="button" class="btn" (click)="session.logout()">Cerrar sesión</button>
  }
</header>
@if (session.misconfigured) {
  <p class="config-error" role="alert">
    Configuración incompleta: la app se ha compilado sin los valores de Auth0/API.
    Crea <code>.env</code> (ver <code>.env.example</code>) y arranca con <code>npm start</code>.
  </p>
}
<main #main id="main" class="app-main" tabindex="-1">
  @if (session.isLoading()) {
    <p role="status">Cargando…</p>
  } @else {
    <router-outlet />
  }
</main>
